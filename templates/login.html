<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ нэвтрэх</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="register-form" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 20px; color: #0b2545;">Админ нэвтрэх</h2>
        {% if error %}
            <p style="color: red; text-align: center; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}
        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label>Нэвтрэх нэр:</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Нууц үг:</label>
                <input type="password" name="password" required placeholder="admin123">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Нэвтрэх</button>
        </form>
        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('index') }}" style="color: #134074; text-decoration: none;">&larr; Нүүр хуудас руу буцах</a>
        </div>
    </div>
</body>
</html>
